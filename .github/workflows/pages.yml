name: Deploy static site
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: generated-pdfs
          path: pdf-snapshot
      - name: Resolve source commit
        id: source
        env:
          CALL_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          snapshot_sha="$(cat pdf-snapshot/.source-sha)"
          if [[ ! "$snapshot_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PDF snapshot has an invalid source commit"
            exit 1
          fi
          if [[ -n "$CALL_SHA" && "$CALL_SHA" != "$snapshot_sha" ]]; then
            echo "::error::PDF snapshot source differs from the requested source commit"
            exit 1
          fi
          echo "sha=$snapshot_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          # Preserve the snapshot checkout when checking out the source at the root.
          clean: false
      - name: Load repository configuration
        id: config
        run: ./scripts/export-config.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.config.outputs.python }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: >-
          python3 -m pip install --disable-pip-version-check
          --requirement .github/requirements-ci.txt
      - name: Validate and generate site from books.yml
        run: make site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: site
          destination: _site
      - name: Prepare PDF destination
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" _site/pdf
      - name: Validate and add the complete PDF snapshot
        run: python3 scripts/stage-site-pdfs.py pdf-snapshot _site/pdf
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
