name: Build textbooks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-image.yml
    with:
      ref: ${{ github.sha }}
  pin-image:
    needs: prepare-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pin the tested image in repository consumers
        env:
          DIGEST: ${{ needs.prepare-image.outputs.digest }}
        run: make image-pin DIGEST="$DIGEST"
      - name: Open an image pin pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/container-image.txt .devcontainer/devcontainer.json
          git commit -m "build(toolchain): pin tested development image"
          branch="automation/image-pin-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "build(toolchain): pin tested development image" \
            --body "Pins the image prepared and tested by the textbook CI workflow."
  plan:
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.books.outputs.matrix }}
      count: ${{ steps.books.outputs.count }}
      site_changed: ${{ steps.books.outputs.site_changed }}
      snapshot_changed: ${{ steps.books.outputs.snapshot_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Load repository configuration
        id: config
        run: ./scripts/export-config.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.config.outputs.python }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: >-
          python3 -m pip install --disable-pip-version-check
          --requirement .github/requirements-ci.txt
      - name: Validate manifest before creating the matrix
        run: python3 scripts/books.py validate
      - name: Read last snapshot source
        if: github.event_name == 'push'
        id: snapshot
        run: ./scripts/snapshot-base.sh
      - name: Create cumulative build matrix
        id: books
        env:
          BASE_SHA: >-
            ${{
              github.event_name == 'push'
              && steps.snapshot.outputs.base
              || (
                github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || ''
              )
            }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            python3 scripts/affected-books.py --all --format github >> "$GITHUB_OUTPUT"
          else
            python3 scripts/affected-books.py --base "$BASE_SHA" --format github >> "$GITHUB_OUTPUT"
          fi
  book:
    needs: [prepare-image, plan]
    if: needs.plan.outputs.count != '0'
    name: Build ${{ matrix.book }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and strictly check in the prepared image
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          docker_image: ${{ needs.prepare-image.outputs.image }}
          run: |
            ./scripts/build-book.sh "${{ matrix.book }}"
            python3 scripts/check-log.py --strict "build/${{ matrix.book }}/book.log"
            cp "build/${{ matrix.book }}/book.pdf" "build/${{ matrix.book }}/${{ matrix.book }}.pdf"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.book }}-pdf
          path: build/${{ matrix.book }}/${{ matrix.book }}.pdf
          if-no-files-found: error
          retention-days: 14
  build-check:
    name: Verify textbook builds
    needs: [prepare-image, plan, book]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all requested textbook builds passed
        env:
          PREPARE_RESULT: ${{ needs.prepare-image.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BOOK_RESULT: ${{ needs.book.result }}
          BOOK_COUNT: ${{ needs.plan.outputs.count }}
        shell: bash
        run: |
          if [[ "$PREPARE_RESULT" != success ]]; then
            echo "::error::Toolchain image preparation ended with: $PREPARE_RESULT"
            exit 1
          fi
          if [[ "$PLAN_RESULT" != success ]]; then
            echo "::error::Build planning ended with: $PLAN_RESULT"
            exit 1
          fi
          if [[ ! "$BOOK_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid textbook build count: ${BOOK_COUNT:-<empty>}"
            exit 1
          fi
          if (( BOOK_COUNT == 0 )); then
            expected=skipped
          else
            expected=success
          fi
          if [[ "$BOOK_RESULT" != "$expected" ]]; then
            echo "::error::Textbook builds ended with: $BOOK_RESULT; expected: $expected"
            exit 1
          fi
  publish:
    name: Publish latest PDF snapshot
    needs: [plan, book]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      (needs.book.result == 'success' || needs.book.result == 'skipped') &&
      (needs.plan.outputs.count != '0' || needs.plan.outputs.site_changed == 'true' ||
      needs.plan.outputs.snapshot_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      current: ${{ steps.publish.outputs.current }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.plan.outputs.count != '0'
        with:
          pattern: '*-pdf'
          path: updated-pdfs
          merge-multiple: true
      - id: publish
        name: Update generated-pdfs snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; its cumulative workflow will publish."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin generated-pdfs >/dev/null 2>&1; then
            git fetch --no-tags origin generated-pdfs
            git worktree add snapshot origin/generated-pdfs
          else
            git worktree add --detach snapshot
            git -C snapshot switch --orphan generated-pdfs
            git -C snapshot rm -r --ignore-unmatch .
          fi
          mkdir -p snapshot/pdf
          shopt -s nullglob
          updated_pdfs=(updated-pdfs/*.pdf)
          for pdf in "${updated_pdfs[@]}"; do
            slug="${pdf##*/}"
            slug="${slug%.pdf}"
            if [[ ! -s "$pdf" ]]; then
              echo "error: PDF artifact is missing or empty: $pdf" >&2
              exit 1
            fi
            python3 scripts/books.py require "$slug" >/dev/null
            cp "$pdf" "snapshot/pdf/$slug.pdf"
          done
          mapfile -t expected < <(python3 scripts/books.py list --for site)
          while IFS= read -r -d '' pdf; do
            slug="${pdf##*/}"
            slug="${slug%.pdf}"
            [[ " ${expected[*]} " == *" $slug "* ]] || rm "$pdf"
          done < <(find snapshot/pdf -maxdepth 1 -type f -name '*.pdf' -print0)
          for slug in "${expected[@]}"; do
            test -s "snapshot/pdf/$slug.pdf" || {
              echo "error: snapshot lacks site PDF $slug;" \
                "dispatch Build textbooks once to bootstrap all PDFs" >&2
              exit 1
            }
          done
          printf '%s\n' "$GITHUB_SHA" > snapshot/.source-sha
          cp .github/generated-pdfs-README.md snapshot/README.md
          git -C snapshot add .source-sha README.md pdf
          if ! git -C snapshot diff --cached --quiet; then
            git -C snapshot commit -m "Update PDFs from ${GITHUB_SHA}"
            git -C snapshot push origin HEAD:generated-pdfs
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
  pages:
    needs: [plan, publish]
    if: >-
      always() && needs.publish.outputs.current == 'true' &&
      (needs.plan.outputs.count != '0' || needs.plan.outputs.site_changed == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_sha: ${{ github.sha }}
