name: Build DevContainer Image
on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - 'scripts/check-toolchain.sh'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latex
  RELEASE_TAG: texlive-2026-20260822
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        with:
          fetch-depth: 0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the immutable release tag against changed image inputs
        id: release-tag
        env:
          BASE_SHA: ${{ github.event.before }}
        run: ./scripts/check-image-tag.sh "${{ github.event_name }}" "$BASE_SHA"
      - name: Set up Docker Buildx
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GitHub Container Registry
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        if: steps.release-tag.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha
      - name: Build image for smoke testing
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=latex-devcontainer
          cache-to: type=gha,scope=latex-devcontainer,mode=max
      - name: Smoke test the image toolchain
        if: steps.release-tag.outputs.exists != 'true'
        run: >-
          docker run --rm
          "${IMAGE_NAME}:${RELEASE_TAG}"
          ./scripts/check-toolchain.sh
      - name: Push tested image tags
        if: steps.release-tag.outputs.exists != 'true'
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< '${{ steps.meta.outputs.tags }}'
