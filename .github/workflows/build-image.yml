name: Build DevContainer Image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-image:
    uses: ./.github/workflows/prepare-image.yml
    with:
      ref: ${{ github.sha }}
  pin:
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: image-pin-pull-request
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pin the tested image in repository consumers
        env:
          DIGEST: ${{ needs.prepare-image.outputs.digest }}
        run: make image pin DIGEST="$DIGEST"
      - name: Update the source branch
        if: github.ref_name != 'main'
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/container-image.txt .devcontainer/devcontainer.json
          git commit -m "build(toolchain): pin tested development image"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
      - name: Open a pin update pull request
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/open-image-pin-pr.sh
