name: Prepare toolchain image
on:
  workflow_call:
    inputs:
      ref:
        description: Git revision containing the image inputs
        required: true
        type: string
    outputs:
      image:
        description: Tested immutable image reference
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Tested image digest without the sha256 prefix
        value: ${{ jobs.publish.outputs.digest }}
concurrency:
  group: prepare-image-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.release-tag.outputs.exists }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        run: ./scripts/export-config.sh
      - name: Derive the content-addressed image tag
        id: tag
        run: |
          input_hash="$({
            sha256sum .devcontainer/Dockerfile
            sha256sum config/toolchain.env
            sha256sum scripts/check-toolchain.sh
            printf '%s\n' 'native-multiarch-v1' 'linux/amd64,linux/arm64'
          } | sha256sum | cut -c 1-12)"
          echo "RELEASE_TAG=texlive-${input_hash}" >> "$GITHUB_ENV"
          echo "tag=texlive-${input_hash}" >> "$GITHUB_OUTPUT"
      - name: Check for an existing immutable image
        id: release-tag
        run: ./scripts/check-image-tag.sh
  build:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        run: ./scripts/export-config.sh
      - name: Set the temporary image tag
        run: echo "BUILD_TAG=${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.prepare.outputs.tag }}
      - name: Build image for smoke testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.BUILD_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
      - name: Smoke test the image toolchain
        run: |
          test "$(docker image inspect "$BUILD_TAG" --format '{{.Architecture}}')" = "$ARCH"
          docker run --rm --platform "linux/$ARCH" "$BUILD_TAG" ./scripts/check-toolchain.sh
      - name: Push the tested image and record its digest
        run: |
          docker push "$BUILD_TAG"
          digest="$(docker buildx imagetools inspect "$BUILD_TAG" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p build/image-digests
          echo "${IMAGE_NAME}@${digest}" > "build/image-digests/${ARCH}"
      - name: Upload the tested image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: build/image-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [prepare, build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.exists == 'true' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        run: ./scripts/export-config.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Download tested image digests
        if: needs.prepare.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-digest-*
          path: build/image-digests
          merge-multiple: true
      - name: Login to GitHub Container Registry
        if: needs.prepare.outputs.exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        if: needs.prepare.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha
      - name: Publish the tested multi-platform index
        if: needs.prepare.outputs.exists != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            source="$(cat "build/image-digests/$arch")"
            digest="${source#"${IMAGE_NAME}@"}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$source")
          done
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Resolve and validate the tested index digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_REF="${IMAGE_NAME}@${digest}" REQUIRE_IMAGE=true ./scripts/check-image-tag.sh
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "reference=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
