name: Prepare toolchain image
on:
  workflow_call:
    inputs:
      ref:
        description: Git revision containing the image inputs
        required: true
        type: string
    outputs:
      image:
        description: Tested immutable image reference
        value: ${{ jobs.prepare.outputs.image }}
      digest:
        description: Tested image digest without the sha256 prefix
        value: ${{ jobs.prepare.outputs.digest }}
concurrency:
  group: prepare-image-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Load repository configuration
        id: config
        run: ./scripts/export-config.sh
      - name: Derive the content-addressed image tag
        run: |
          input_hash="$({
            sha256sum .devcontainer/Dockerfile
            sha256sum config/toolchain.env
            sha256sum scripts/check-toolchain.sh
          } | sha256sum | cut -c 1-12)"
          echo "RELEASE_TAG=texlive-${input_hash}" >> "$GITHUB_ENV"
      - name: Check for an existing immutable image
        id: release-tag
        run: ./scripts/check-image-tag.sh
      - name: Set up Docker Buildx
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GitHub Container Registry
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        if: steps.release-tag.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha
      - name: Build image for smoke testing
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
      - name: Smoke test the image toolchain
        if: steps.release-tag.outputs.exists != 'true'
        run: >-
          docker run --rm
          "${IMAGE_NAME}:${RELEASE_TAG}"
          ./scripts/check-toolchain.sh
      - name: Push tested image tags
        if: steps.release-tag.outputs.exists != 'true'
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< '${{ steps.meta.outputs.tags }}'
      - name: Resolve the tested image digest
        id: image
        run: |
          digest="$(
            docker buildx imagetools inspect \
            "${IMAGE_NAME}:${RELEASE_TAG}" \
            --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: invalid image digest: $digest" >&2
            exit 1
          fi
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "reference=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
