name: Check sources
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Source and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changes
        name: Classify changed files
        env:
          BASE_SHA: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before
            }}
        shell: bash
        run: |
          paths="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || git ls-files)"
          structured_pattern='^(\.github/.*\.yml|books\.yml|CITATION\.cff'
          structured_pattern+='|\.devcontainer/devcontainer\.json)'
          if grep -Eq "$structured_pattern" <<< "$paths"; then
            echo "structured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Load repository configuration
        id: config
        run: ./scripts/export-config.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.config.outputs.python }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install repository check dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes ripgrep
          fi
          command -v rg
      - run: >-
          python3 -m pip install --disable-pip-version-check
          --requirement .github/requirements-ci.txt
      - name: Set up the pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          lake-package-directory: lean
          use-github-cache: false
          use-mathlib-cache: true
      - name: Check Lean proofs and LaTeX links
        run: make lean check
      - name: Repository structure, metadata, labels, generated files, and draft markers
        run: ./scripts/check-repository.sh
      - name: Python formatting and lint
        run: make format py check
      - name: Unit tests
        run: make test
      - name: YAML and JSON syntax
        if: steps.changes.outputs.structured == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import yaml
          for path in sorted(Path('.github').rglob('*.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(path)
          yaml.safe_load(Path('CITATION.cff').read_text(encoding='utf-8'))
          json.loads(Path('.devcontainer/devcontainer.json').read_text(encoding='utf-8'))
          PY
      - name: GitHub Actions semantics
        if: steps.changes.outputs.structured == 'true'
        run: ./scripts/check-actions.sh
  prepare-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-image.yml
    with:
      ref: ${{ github.sha }}
  latex:
    name: Source formatting
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          docker_image: ${{ needs.prepare-image.outputs.image }}
          run: |
            git config --global --add safe.directory "$(pwd)"
            make format sh check
            make format tex check
  check:
    name: Check sources
    needs: [source, latex]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Source and LaTeX checks passed."
